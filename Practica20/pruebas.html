<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=p, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #333;">
    <p>
        Parrafo inicial
    </p>

    <script>
        const parrafo = document.getElementsByTagName("p")[0];
        console.log(parrafo)
        setTimeout(() =>{
            let parrafo2 = document.createElement("p");
            let nodoDeTexto = document.createTextNode("Hola mundo estoy manipulando el DOM");
            parrafo2.appendChild(nodoDeTexto);
            document.body.appendChild(parrafo2);
        }, 2000);

        setTimeout(() =>{
            parrafo.parentNode.removeChild(parrafo);
        }, 3000);
        </script>
</body>
</html>
